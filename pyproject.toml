[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-meta-analyzer"
version = "0.1.0"
description = "Audit a web page's on-page SEO signals and produce a scored report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthews Wong" }]
keywords = ["seo", "cli", "html", "audit", "meta-tags"]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "click>=8.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
seo-meta-analyzer = "seometa.cli:main"

[tool.setuptools]
packages = ["seometa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
